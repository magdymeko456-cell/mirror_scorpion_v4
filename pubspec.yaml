name: mirror_scorpion_v4
description: Royal Dark mobile utility for translation, inspiration, games, and secure PRO activation.
publish_to: "none"
version: 4.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.3.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.13.0
  google_mlkit_language_id: ^0.15.1
  google_mlkit_translation: ^0.15.1
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
