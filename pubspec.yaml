name: mirror_scorpion_v4
description: Royal Dark mobile utility for translation, inspiration, games, and secure PRO activation.
publish_to: "none"
version: 4.0.9+10

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  audioplayers: ^6.0.0
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.3.0
  crypto: ^3.0.6
  shared_preferences: ^2.5.5
  firebase_core: ^4.13.0
  google_mlkit_language_id: ^0.15.1
  google_mlkit_translation: ^0.15.1
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.3
  file_picker: ^12.1.2
  path_provider: ^2.1.5
  chess: ^0.8.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  read_pdf_text: ^0.3.1
  pdf: ^3.13.0
  printing: ^5.15.0
  flutter_overlay_window: ^0.5.0
  receive_sharing_intent: ^1.9.0
  flutter_svg: ^2.2.3
  share_plus: ^13.3.0
  whisper_ggml: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: assets/images/scorpion_bg.jpeg

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/fonts/
    - assets/images/
    - assets/images/chess/meridian_shaded/
