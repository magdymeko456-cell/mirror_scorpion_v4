<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#3A4667"/>
      <stop offset="100%" stop-color="#1B2838"/>
    </radialGradient>
    <linearGradient id="whitePiece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C8CFDA"/>
    </linearGradient>
    <linearGradient id="blackPiece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A5468"/>
      <stop offset="100%" stop-color="#161C28"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- الملك الأبيض (يسار) -->
  <g filter="url(#softShadow)" transform="translate(150 300)">
    <path fill="url(#whitePiece)" d="M0,-110 C10,-110 18,-102 18,-92 L18,-78 C40,-70 58,-50 58,-22 L58,30 L10,30 L10,45 C10,52 4,58 -4,58 L-4,70 L-70,70 L-70,45 C-70,30 -60,25 -60,10 L-60,-22 C-60,-50 -42,-70 -20,-78 L-20,-92 C-20,-102 -12,-110 0,-110 Z"/>
    <ellipse cx="0" cy="-118" rx="16" ry="8" fill="url(#whitePiece)"/>
  </g>

  <!-- الملك الأسود (يمين، متداخل قليلاً) -->
  <g filter="url(#softShadow)" transform="translate(310 305)">
    <path fill="url(#blackPiece)" d="M0,-110 C10,-110 18,-102 18,-92 L18,-78 C40,-70 58,-50 58,-22 L58,30 L10,30 L10,45 C10,52 4,58 -4,58 L-4,70 L-70,70 L-70,45 C-70,30 -60,25 -60,10 L-60,-22 C-60,-50 -42,-70 -20,-78 L-20,-92 C-20,-102 -12,-110 0,-110 Z"/>
    <ellipse cx="0" cy="-118" rx="16" ry="8" fill="url(#blackPiece)"/>
  </g>

  <!-- أرضية الظل -->
  <ellipse cx="160" cy="382" rx="78" ry="14" fill="#000" opacity="0.35"/>
  <ellipse cx="320" cy="386" rx="78" ry="14" fill="#000" opacity="0.35"/>
</svg>