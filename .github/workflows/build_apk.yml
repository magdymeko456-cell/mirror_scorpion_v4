name: Mirror Scorpion v4 APK Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mirror-scorpion-v4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate Android project from Expo configuration
        run: pnpm exec expo prebuild --clean --platform android --no-install
      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirror-scorpion-v4-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
