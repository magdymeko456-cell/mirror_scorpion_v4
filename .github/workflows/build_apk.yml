name: Mirror Scorpion v4 Flutter APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Verify Firebase Functions
        working-directory: functions
        run: |
          npm ci
          npm run verify
      - name: Verify ElevenLabs secret stays outside the APK
        run: |
          if grep -R -nE 'ELEVENLABS_API_KEY|xi-api-key|api\.elevenlabs\.io' lib test; then
            echo "ElevenLabs credentials or direct provider calls must not be present in Flutter code."
            exit 1
          fi
      - name: Verify Runware secret stays outside the APK
        run: |
          if grep -R -nE 'RUNWARE_API_KEY|api\.runware\.ai|runware\.ai/v1|videoInference' lib test; then
            echo "Runware credentials or direct provider calls must not be present in Flutter code."
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Android project
        run: flutter create --platforms=android --project-name mirror_scorpion_v4 .
      - name: Configure Firebase Android
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$ANDROID_GOOGLE_SERVICES_JSON" || {
            echo "ANDROID_GOOGLE_SERVICES_JSON is required for the Android Firebase build."
            exit 1
          }
          mkdir -p android/app
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          grep -q '"package_name": "com.mirror.scorpion.v4"' android/app/google-services.json || {
            echo "The Firebase Android configuration does not match com.mirror.scorpion.v4."
            exit 1
          }
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "com.example.mirror_scorpion_v4"/applicationId = "com.mirror.scorpion.v4"/' android/app/build.gradle.kts
            grep -q 'applicationId = "com.mirror.scorpion.v4"' android/app/build.gradle.kts || exit 1
            grep -q 'com.google.gms.google-services' android/settings.gradle.kts || \
              sed -i '/id("com.android.application") version/a\    id("com.google.gms.google-services") version "4.5.0" apply false' android/settings.gradle.kts
            grep -q 'com.google.gms.google-services' android/app/build.gradle.kts || \
              sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId "com.example.mirror_scorpion_v4"/applicationId "com.mirror.scorpion.v4"/' android/app/build.gradle
            grep -q 'applicationId "com.mirror.scorpion.v4"' android/app/build.gradle || exit 1
            grep -q 'com.google.gms.google-services' android/build.gradle || \
              sed -i "/id 'com.android.application' version/a\    id 'com.google.gms.google-services' version '4.5.0' apply false" android/build.gradle
            grep -q 'com.google.gms.google-services' android/app/build.gradle || \
              sed -i "/id 'com.android.application'/a\    id 'com.google.gms.google-services'" android/app/build.gradle
          else
            echo "Android app Gradle file was not generated."
            exit 1
          fi
          if [ -f android/app/build.gradle.kts ]; then
            printf '\n%s\n' \
              'dependencies {' \
              '    implementation("com.google.mlkit:text-recognition-chinese:16.0.1")' \
              '    implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")' \
              '    implementation("com.google.mlkit:text-recognition-japanese:16.0.1")' \
              '    implementation("com.google.mlkit:text-recognition-korean:16.0.1")' \
              '}' >> android/app/build.gradle.kts
          else
            printf '\n%s\n' \
              'dependencies {' \
              "    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'" \
              "    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'" \
              "    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'" \
              "    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'" \
              '}' >> android/app/build.gradle
          fi
      - name: Configure Android speech visibility and microphone permission
        run: |
          if ! grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml
          fi
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          fi
          if ! grep -q 'android.intent.action.TTS_SERVICE' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/i\    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>' android/app/src/main/AndroidManifest.xml
          fi
          if ! grep -q 'android.speech.RecognitionService' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/i\    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>' android/app/src/main/AndroidManifest.xml
          fi
      - name: Configure PDF text extraction R8 rule
        run: |
          cat > android/app/mirror-scorpion-pdf-r8.pro <<'EOF'
          # PDFBox references an optional JPX decoder. Text extraction does not package it.
          -dontwarn com.gemalto.jp2.**
          EOF
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts <<'EOF'

          android {
              buildTypes {
                  getByName("release") {
                      proguardFiles("mirror-scorpion-pdf-r8.pro")
                  }
              }
          }
          EOF
          elif [ -f android/app/build.gradle ]; then
            cat >> android/app/build.gradle <<'EOF'

          android {
              buildTypes {
                  release {
                      proguardFiles 'mirror-scorpion-pdf-r8.pro'
                  }
              }
          }
          EOF
          else
            echo "Android app Gradle file was not generated."
            exit 1
          fi
          grep -q -- '-dontwarn com.gemalto.jp2.\*\*' android/app/mirror-scorpion-pdf-r8.pro
      - name: Install dependencies
        run: flutter pub get
      - name: Generate scorpion Android launcher icon
        run: dart run flutter_launcher_icons
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Remove Firebase Android config
        if: always()
        run: rm -f android/app/google-services.json
      - uses: actions/upload-artifact@v4
        with:
          name: mirror-scorpion-v4-flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
